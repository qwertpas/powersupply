<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f3f2ed">
  <title>powersupply</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <header><h1>powersupply<span class="device">SKY TOPPOWER</span></h1><span id="status" role="status">Opening log…</span></header>
    <section class="toolbar" aria-label="Connection and logging">
      <button id="connect" disabled>Connect</button>
      <label class="address">Device ID <input id="address" type="number" min="1" max="250" value="1"></label>
      <div class="spacer"></div>
      <button id="save" class="secondary" disabled>Save CSV</button>
      <button id="clear" class="secondary" disabled>Clear log</button>
    </section>
    <section class="readings" aria-label="Measurements">
      <label class="reading voltage"><span><input type="checkbox" data-field="voltage" checked> Voltage</span><strong id="voltage">—<small>V</small></strong></label>
      <label class="reading current"><span><input type="checkbox" data-field="current" checked> Current</span><strong id="current">—<small>A</small></strong></label>
      <label class="reading output"><span><input type="checkbox" data-field="output" checked> Output</span><strong id="output">—<small>0 / 1</small></strong></label>
      <label class="reading temperature"><span><input type="checkbox" data-field="temperature" checked> Temperature</span><strong id="temperature">—<small>°C</small></strong></label>
    </section>
    <section class="plot-panel" aria-label="Rolling measurements">
      <div class="plot-controls"><label>Horizon <input id="horizon" type="number" min="1" max="120" value="15"> min</label><input id="range" aria-label="Horizon in minutes" type="range" min="1" max="120" value="15"><span id="rate"></span></div>
      <div class="plot-area">
        <canvas id="plot" aria-label="Rolling plot of selected measurements"></canvas>
        <div id="tooltip" role="tooltip" hidden></div>
      </div>
      <footer><span id="count">0 samples saved</span><span>3,600 plot points max</span></footer>
    </section>
    <p id="message" role="alert"></p>
  </main>
</body>
</html>
